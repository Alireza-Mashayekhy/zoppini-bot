services:
  zoppini-bale-bot:
    build: .
    container_name: zoppini-bale-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_STATE_FILE=/data/bot-state.json
      - BOT_HEARTBEAT_FILE=/tmp/bot-heartbeat.json
    volumes:
      - zoppini_bale_bot_data:/data
    networks:
      - back_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  zoppini_bale_bot_data:

networks:
  back_net:
    external: true
    name: zoppini-back_default # اگر خروجی NET_NAME نام دیگری بود، همان را بگذارید
